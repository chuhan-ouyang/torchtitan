# torchtitan Config.toml
# NOTE: this toml config is a preset for 64 A100 GPUs.

[job]
dump_folder = "./outputs"
description = "Llama 3 8B training"

[profiling]
enable_profiling = true
save_traces_folder = "/pscratch/sd/c/co232/profile_trace_8b_tp_1_dp_2_shard_pp_1_cp_2"
profile_freq = 20
profile_window = 10
# first 20 steps:  wait (7) + warmup (3) + profile window (10)
# second 20 steps: wait (7) + warmup (3) + profile window (10)

[metrics]
log_freq = 10
enable_tensorboard = true
save_tb_folder = "tb"

[model]
name = "llama3"
flavor = "8B"
tokenizer_path = "./assets/tokenizer/original/tokenizer.model"
# converters = ["float8"]

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 0  # lr scheduler warm up

[training]
# microbatch >= piepeline degree
local_batch_size = 1
seq_len = 8192
max_norm = 1.0  # grad norm clipping
steps = 20
compile = false
dataset = "c4"
dataset_cache_dir = "/pscratch/sd/c/co232/hf_cache"
dataset_streaming = false
# microbatch >= pipeline stages

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = 2
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 2

[checkpoint]
enable_checkpoint = false
folder = "checkpoint"
interval = 500
last_save_model_weights_only = false
export_dtype = "float32"
async_mode = "disabled" # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = "selective"  # ["none", "selective", "full"]
selective_ac_option = "op"  # "int" = ac every positive int layer or 'op', ac based on ops policy

[float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]